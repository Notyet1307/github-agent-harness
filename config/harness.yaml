version: 1

issueLabel: ready-for-agent

pollIntervalSeconds: 120
maxConcurrentTotal: 1
maxAuditRounds: 3
implementTimeoutMinutes: 45
auditTimeoutMinutes: 45

mergePolicy:
  mode: wait
  autoMerge: false

orca:
  cliPath: orca
  cliPathFallback: /Applications/Orca.app/Contents/Resources/bin/orca
  controllerWorktreePath: /Users/yang/github-agent-harness
  controllerTitle: harness-controller

# Role → profile id. Swap implementer to a Pi profile later without code changes.
activeProfiles:
  implementer: codex-default
  auditor: pi-reviewer

agentProfiles:
  codex-default:
    id: codex-default
    role: implementer
    runtime: orca
    orcaAgent: codex
    invokeHint: "Explicitly invoke the $implement skill."

  # Dedicated audit profile: controller-owned skill + user-scope reviewer only.
  pi-reviewer:
    id: pi-reviewer
    role: auditor
    runtime: orca
    orcaAgent: pi
    # The launcher follows the parent Pi provider/model while isolating audit resources.
    command: "/Users/yang/github-agent-harness/scripts/pi-auditor"
    readonly: true
    invokeHint: "Explicitly invoke /skill:matt-code-review-pi with the fixed base SHA. Use only the controller-owned harness-reviewer in user scope."

  # Example future implementer (not active):
  # pi-implementer-a:
  #   id: pi-implementer-a
  #   role: implementer
  #   runtime: orca
  #   orcaAgent: pi
  #   command: "pi"
  #   env:
  #     PI_CODING_AGENT_DIR: /Users/yang/.pi/profiles/implementer-a
  #   invokeHint: "Explicitly run the implement skill for this issue."

repositories:
  - github: Notyet1307/harness-sandbox
    localPath: /Users/yang/harness-sandbox
    orcaRepoId: 8111723c-f78d-419c-b2c4-0150f4374451
    baseRef: origin/main
    defaultBranch: main
